[project]
name = "portfolio-api"
version = "0.1.0"
description = "Portfolio backend with AI job matching, a job description analyzer and RAG search for a chatbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.0.0",
    "fastapi>=0.135.3",
    "pydantic-settings>=2.13.1",
    "uvicorn>=0.44.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "tavily-python>=0.7",
    "python-dotenv>=1.0.0",
    "google-genai>=2.28.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "fakeredis>=2.39.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running MongoDB (skipped if unreachable)"]
