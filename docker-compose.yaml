services:
  redis:
    image: redis:7.0-alpine

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb

  chatbot:
    build: ./chatbot
    container_name: chatbot
    ports:
      - "8001:8001"
    command: adk web --host 0.0.0.0 --port 8001
    env_file:
      - .env
    depends_on:
      - api

volumes:
  mongo_data: